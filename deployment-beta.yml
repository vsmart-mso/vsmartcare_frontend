# Applied by the Jenkinsfile beta path on every run (see "Deploy Kubernetes"
# beta branch) — idempotent, so this is also the reference copy of what's
# live on np (ns staging). Manual apply is only needed for a fresh
# cluster/namespace that's never run the beta pipeline yet.

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: staging
  name: vcare-frontend
  labels:
    app: vcare-frontend
spec:
  selector:
    matchLabels:
      app: vcare-frontend
  template:
    metadata:
      labels:
        app: vcare-frontend
    spec:
      imagePullSecrets:
        - name: regcred
        - name: regcred-staging
        - name: betabackcred
      containers:
        - name: vcare-frontend
          image: registry-vs.m-society.go.th/root/vcare-frontend:latest-beta
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
