# DO NOT COMMIT THIS FILE — add secrets.yml to .gitignore
# VITE_ vars are baked into the build at compile time (not runtime)
# Jenkins reads these values and passes them as --build-arg during docker build

apiVersion: v1
kind: Secret
metadata:
  namespace: vcare
  name: vcare-frontend-secret
type: Opaque
stringData:
  VITE_API_URL: "https://vsmart-care.m-society.go.th/api-vsmartcare"
  VITE_BFF_API_KEY: "change-me"
  VITE_OCR_API_URL: "https://vsmart-care.m-society.go.th/api-vsmartcare-ocr"
  VITE_LOGIN_BETA_NOTICE: "false"
