apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: staging
  name: vcare-frontend-beta
  labels:
    app: vcare-frontend-beta
spec:
  selector:
    matchLabels:
      app: vcare-frontend-beta
  template:
    metadata:
      labels:
        app: vcare-frontend-beta
    spec:
      imagePullSecrets:
        - name: betabackcred
      containers:
        - name: vcare-frontend
          image: staging-registry-vs.m-society.go.th/root/vcare-frontend-beta:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
