<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AINU liveness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    หน้านี้ถูกฝังเป็น iframe จากแอปหลัก (ดู LivenessRunner.vue ในโฟลเดอร์เดียวกัน)

    ⚠️ ห้าม import style.css / Tailwind เข้าหน้านี้เด็ดขาด — SDK จะตายเงียบ ๆ
    เหตุผลเต็มและกับดักอื่น ๆ อยู่ใน README.md ของโฟลเดอร์นี้ อ่านก่อนแก้

    ตัว SDK เป็น IIFE ที่ยัด global `window.AinuEkyc` โหลดเป็น npm module ไม่ได้
    ไฟล์อยู่ที่ public/ ชื่อต้องตรงกับข้างล่างเป๊ะ ไม่มี bundler resolution มาช่วย
    ถ้าชื่อไม่ตรงจะพังตอน runtime (window.AinuEkyc เป็น undefined) ไม่ใช่ตอน build
  -->
  <script src="/ekyc-sdk-v1.0.3-beta.1.index.iife.js"></script>

  <!-- โหลด CSS ด้วย <link> ไม่ใช่ import จาก frame.ts เด็ดขาด
       ถ้า import จาก JS ตอน dev Vite จะฉีด CSS หลัง HTML วาดเสร็จ → เห็นจอรอแบบไม่มีสไตล์
       หนึ่งจังหวะ (โลโก้ขนาดจริงชิดซ้าย ปุ่มมาตรฐาน) แล้วค่อยกระโดดเข้าที่
       <link> ทำให้เบราว์เซอร์รอ CSS ก่อนวาด จึงไม่มีทางกระพริบ -->
  <link rel="stylesheet" href="./frame.css" />
</head>

<body>
  <div id="ekyc-container"></div>

  <!-- จอคั่นระหว่าง AINU handshake — ถ้าไม่มี ผู้ใช้จะเห็น spinner "Verifying authentication"
       ของ AINU ซึ่งไม่มีแบรนด์ ซ่อนตัวเองตอน onReady พอดีกับที่จอ Guidelines ขึ้นมาแทน
       ยังเป็นที่แสดงข้อความ 'กดปุ่ม "เริ่ม"' ตอน auto-start ไม่ติดด้วย -->
  <div id="loading">
    <img id="loading-logo" src="/logo-vcare.jpg" alt="พม. CARE" width="272" height="128" />
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">กำลังเตรียมการยืนยันตัวตน...</p>
  </div>

  <div class="control-panel">
    <!-- ปกติ SDK จะเริ่มเองหลัง onLoaded ปุ่มนี้เป็นทางสำรองเวลา auto-start ไม่ติด
         (บาง browser ต้องการ user gesture ในหน้านี้เองถึงจะเปิดกล้องได้) -->
    <button id="liveness-start" class="primary" type="button" hidden>เริ่ม</button>
    <button id="liveness-close" type="button">ยกเลิก</button>
  </div>

  <p id="frame-error" hidden></p>

  <script type="module" src="./frame.ts"></script>
</body>

</html>
