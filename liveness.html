<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AINU liveness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    หน้านี้ถูกฝังเป็น iframe จากแอปหลัก (ดู src/components/liveness/LivenessRunner.vue)

    ⚠️ ห้าม import style.css หรือ Tailwind ในหน้านี้เด็ดขาด
    UI ของ AINU SDK เรนเดอร์ด้วยคลาส Tailwind ของตัวมันเอง ถ้าเจอ Tailwind v4
    ของโปรเจกต์ (นิยาม --tw-* คนละชุด) layout จะพัง — spinner ตกจอแล้วหน้าขาว
    พิสูจน์แล้วด้วยการ bisect: sample + Tailwind = พัง, sample + brand.css = ผ่าน

    CSS ข้างล่างลอกจาก eKYC-SDK_sample-code/ekyc-sdk_sample-code.html ตรง ๆ
  -->
  <script src="/ekyc-sdk-v1.0.3-beta.1.index.iife.js"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    #ekyc-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 10;
    }

    #ekyc-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }

    .control-panel {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    .control-panel button {
      padding: 6px 14px;
      font: 600 13px/1.4 system-ui, sans-serif;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(0, 0, 0, .55);
      color: #fff;
      cursor: pointer;
    }

    .control-panel button.primary {
      background: #1A56DB;
      border-color: #1A56DB;
    }

    /* หน้าจอรอ ระหว่าง SDK โหลดจนกว่า UI ของ AINU จะขึ้น
       ไม่งั้นผู้ใช้จะเห็นจอดำเปล่า ๆ แล้วนึกว่าค้าง */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font: 15px/1.5 system-ui, -apple-system, sans-serif;
    }

    #loading[hidden] {
      display: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, .25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 3s;
      }
    }

    #frame-error {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      margin: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(220, 38, 38, .95);
      color: #fff;
      font: 13px/1.4 system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <div id="ekyc-container"></div>

  <!-- ทับจอไว้จนกว่า SDK จะเริ่มทำงาน (ซ่อนตอน onReady) -->
  <div id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text">กำลังเตรียมกล้อง...</p>
  </div>

  <div class="control-panel">
    <!-- ปกติ SDK จะเริ่มเองหลัง onLoaded ปุ่มนี้เป็นทางสำรองเวลา auto-start ไม่ติด
         (บาง browser ต้องการ user gesture ในหน้านี้เองถึงจะเปิดกล้องได้) -->
    <button id="liveness-start" class="primary" type="button" hidden>เริ่ม</button>
    <button id="liveness-close" type="button">ยกเลิก</button>
  </div>

  <p id="frame-error" hidden></p>

  <script type="module" src="/src/liveness-frame.ts"></script>
</body>

</html>
